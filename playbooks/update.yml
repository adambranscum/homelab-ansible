---
- name: Update packages and reboot if needed (all servers except sybil)
  hosts: ubuntu_servers:!sybil
  become: true
  serial: 1
  tasks:
    - name: Refresh apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
        autoclean: true

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Reboot by Ansible after updates"
        reboot_timeout: 900
        post_reboot_delay: 30
      when: reboot_flag.stat.exists

- name: Update sybil (never reboots itself)
  hosts: sybil
  become: true
  tasks:
    - name: Refresh apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
        autoclean: true

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Report that sybil needs a manual reboot
      ansible.builtin.debug:
        msg: "sybil needs a reboot"
      when: reboot_flag.stat.exists
